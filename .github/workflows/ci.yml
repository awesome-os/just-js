name: CI — awesome-os/just-js (Ghost CAS Dynamic V8 + Native Components)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-just-ghost-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hydrate Dynamic V8 + Native Components from Canonical O(1) Ghost CAS (cas-v1)
        run: node ghost-hydrate.mts
